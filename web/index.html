<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — Home</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="rtl">
  <div id="site-header"></div>

  <main class="page-main">
    <section class="hero container">
      <div class="hero-grid">
        <div>
          <h1>
            <span data-i18n="hero_title_1"></span>
            <span class="highlight" data-i18n="hero_title_2"></span>
          </h1>
          <p data-i18n="hero_sub"></p>
          <form id="hero-search-form" class="search-bar">
            <select id="search-type" name="type"></select>
            <input type="text" id="search-location" data-i18n-placeholder="search_location">
            <button type="submit" class="btn btn-primary" data-i18n="search_btn"></button>
          </form>
        </div>
        <div class="hero-visual">
          <div class="hero-image"></div>
          <div class="hero-badge">
            <span>+500</span>
            <div style="font-size:0.85rem;color:var(--text-secondary)">خبراء معتمدون</div>
          </div>
        </div>
      </div>
    </section>

    <section class="container">
      <h2 class="section-title" data-i18n="services_title"></h2>
      <p class="section-subtitle" data-i18n="services_sub"></p>
      <div class="service-cards">
        <article class="service-type-card">
          <div class="icon-box">🔧</div>
          <h3 data-i18n="mechanic"></h3>
          <p style="color:var(--text-secondary);font-size:0.9rem">صيانة وإصلاح مع فنيين معتمدين</p>
          <ul><li>24/7</li><li>فنيون معتمدون</li></ul>
          <a href="pages/services.html?category=mechanic" class="btn btn-ghost btn-block" data-i18n="discover_more"></a>
        </article>
        <article class="service-type-card">
          <div class="icon-box">⚙️</div>
          <h3 data-i18n="spare_parts"></h3>
          <p style="color:var(--text-secondary);font-size:0.9rem">قطع أصلية وتوصيل</p>
          <ul><li>قطع أصلية</li><li>توصيل للمنزل</li></ul>
          <a href="pages/services.html?category=spare-parts" class="btn btn-ghost btn-block" data-i18n="shop_now"></a>
        </article>
        <article class="service-type-card">
          <div class="icon-box">🚛</div>
          <h3 data-i18n="towing"></h3>
          <p style="color:var(--text-secondary);font-size:0.9rem">ونش طوارئ سريع</p>
          <ul><li>استجابة 15 دقيقة</li><li>تتبع GPS</li></ul>
          <a href="pages/emergency.html" class="btn btn-ghost btn-block" data-i18n="order_now"></a>
        </article>
      </div>

      <section class="cta-banner">
        <div class="hero-image" style="min-height:160px"></div>
        <div>
          <h2 data-i18n="cta_join_title"></h2>
          <p data-i18n="cta_join_sub"></p>
          <a href="pages/provider-register.html" class="btn btn-primary" data-i18n="partner_btn"></a>
          <a href="pages/services.html" class="btn btn-ghost" data-i18n="learn_more"></a>
        </div>
      </section>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/mock-handlers.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
