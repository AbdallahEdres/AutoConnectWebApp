<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — Profile</title>
  <link rel="stylesheet" href="../variables.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="profile.css">
</head>

<body class="rtl">
  <div id="site-header"></div>

  <div class="layout-with-sidebar container page-main" style="padding-top:1.5rem">
    <!-- 1. SIDEBAR NAVIGATION START -->
    <aside class="sidebar" id="sidebar-nav"></aside>

    <div>
      <h1 style="color:var(--accent-yellow);margin-bottom:1rem" id="profile_title"></h1>

      <!-- 2. USER PROFILE INFO & STATS START -->
      <!-- Handled by: web/js/profile.js -> loadUserProfile() -->
      <div class="grid-2" style="margin-bottom:1.25rem">
        <article class="card profile-header-card">
          <h2 id="user-name">...</h2>
          <p id="user-id" style="color:var(--text-muted);font-size:0.85rem">...</p>
          <span id="user-role-badge" class="role-badge"></span>
          <div>
            <div id="client-vehicle-info">
              <p id="user-vehicle-row" class="provider-card__meta" style="display:none">🚗 <span id="user-vehicle"></span></p>
              <p id="user-city-row" class="provider-card__meta" style="display:none">📍 <span id="user-city"></span></p>
            </div>
          </div>
          
          <a href="../settings/index.html" class="btn btn-primary btn-sm" style="margin-top:0.75rem;display:block"
            data-i18n="edit_profile"></a>
        </article>
        <article class="card">
          <h3 data-i18n="service_summary"></h3>
          <div class="profile-stats" style="margin-top:1rem">
            <div class="stat-box">
              <p class="number" id="total-visits">0</p>
              <p style="font-size:0.8rem;color:var(--text-secondary)" data-i18n="total_visits"></p>
            </div>
            <div class="stat-box">
              <p class="number" style="font-size:1rem">—</p>
              <p style="font-size:0.8rem;color:var(--text-secondary)" data-i18n="last_visit"></p>
            </div>
            <div class="stat-box">
              <p class="number" style="font-size:0.9rem;color:var(--warning)">—</p>
              <p style="font-size:0.8rem;color:var(--text-secondary)" data-i18n="next_maintenance"></p>
            </div>
          </div>
        </article>
      </div>

      <!-- 3. FAVORITE PROVIDERS WIDGET START (client only) -->
      <!-- Handled by: web/js/profile.js -> loadProfileFavorites() -->
      <section id="client-favorites" style="margin-bottom:1.25rem">
        <div style="display:flex;justify-content:space-between;margin-bottom:1rem">
          <h2 class="section-title" data-i18n="favorite_providers"></h2>
          <a href="../favorites/index.html" data-i18n="view_all"></a>
        </div>
        <div class="grid-auto">
          <div id="profile-favorites" style="display:contents"></div>
          <a href="../favorites/index.html" class="add-provider-card">
            <span style="font-size:2rem">+</span>
            <span data-i18n="add_provider"></span>
          </a>
        </div>
      </section>

      <!-- 3b. AGENT WORKSHOPS WIDGET (agent only) -->
      <section id="agent-section" style="display:none;margin-bottom:1.25rem">
        <div style="display:flex;justify-content:space-between;margin-bottom:1rem">
          <h2 class="section-title" data-i18n="agent_section_title"></h2>
        </div>
        <div class="grid-auto">
          <div id="agent-providers" style="display:contents"></div>
          <a href="../provider-register/index.html" class="add-provider-card">
            <span style="font-size:2rem">+</span>
            <span data-i18n="add_provider"></span>
          </a>
        </div>
      </section>

      <!-- 3c. SUPERVISOR REVIEW WIDGET (supervisor only) -->
      <section id="supervisor-section" class="card" style="display:none;margin-bottom:1.25rem">
        <h3 data-i18n="supervisor_section_title"></h3>
        <p class="section-subtitle" style="margin-top:0.5rem" data-i18n="supervisor_section_desc"></p>
        <a href="../services/index.html" class="btn btn-primary btn-sm" style="margin-top:0.75rem;display:inline-block"
          data-i18n="explore_directory"></a>
      </section>

      <!-- <div class="grid-2">
        <article id="saved-location-card" class="card" style="display:none">
          <div class="map-placeholder"><span data-i18n="saved_location"></span><br><span id="saved-location"></span>
          </div>
        </article>
        <article class="card">
          <h3 data-i18n="account_settings"></h3>
          <ul style="margin-top:1rem">
            <li style="padding:0.65rem 0;border-bottom:1px solid var(--border-color)">
              <a href="../settings/index.html" data-i18n="change_password"></a>
            </li>
            <li style="padding:0.65rem 0;border-bottom:1px solid var(--border-color)">
              <a href="#" data-i18n="notification_prefs"></a>
            </li>
            <li style="padding:0.65rem 0">
              <button type="button" id="lang-toggle" class="lang-toggle" onclick="toggleLanguage()" style="width:100%">EN</button>
            </li>
          </ul>
        </article>
      </div> -->
    </div>
  </div>

  <!-- 4. FOOTER -->
  <div id="site-footer"></div>

  <script src="../i18n.js"></script>
  <script src="../main.js"></script>
  <script src="profile.js"></script>
</body>

</html>
