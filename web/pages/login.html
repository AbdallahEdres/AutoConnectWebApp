<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — Login</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="rtl auth-page">
  <div id="site-header"></div>

  <div class="auth-card-wrap">
    <div class="auth-card">
      <p class="auth-logo">AutoConnect</p>
      <div class="role-toggle">
        <button type="button" data-i18n="service_provider"></button>
        <button type="button" class="active" data-i18n="customer"></button>
      </div>
      <h2 class="section-title" data-i18n="login_title"></h2>
      <p class="section-subtitle" data-i18n="login_sub"></p>
      <form id="login-form">
        <div class="form-group">
          <label for="email" data-i18n="email"></label>
          <input class="form-control" type="email" id="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="password"></label>
          <input class="form-control" type="password" id="password" placeholder="********" required>
          <a href="#" style="font-size:0.8rem;color:var(--accent-yellow);float:inline-end" data-i18n="forgot_password"></a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="login_btn"></button>
      </form>
      <p class="auth-divider" data-i18n="or"></p>
      <a href="services.html" class="btn btn-ghost btn-block" data-i18n="guest_btn"></a>
      <p class="auth-footer-text">
        <span data-i18n="no_account"></span>
        <a href="register.html" data-i18n="signup_link"></a>
      </p>
      <p id="demo-hint" style="margin-top:1rem;font-size:0.75rem;color:var(--text-muted);text-align:center"></p>
    </div>
  </div>

  <div class="provider-cta container">
    <span>🤝</span>
    <p data-i18n="cta_join_sub"></p>
    <a href="provider-register.html" class="btn btn-ghost btn-sm" data-i18n="partner_btn"></a>
  </div>

  <div id="site-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/mock-handlers.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
