<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — إنشاء حساب</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    .req { color: var(--accent-yellow); }
    .wh-grid { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
    .wh-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 0.25rem 0; }
    .wh-day-name { min-width: 72px; font-size: 0.9rem; font-weight: 500; }
    .wh-closed-label { display: flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .wh-time { width: 110px !important; padding: 0.3rem 0.5rem !important; }
    .wh-open:disabled, .wh-close:disabled { opacity: 0.35; pointer-events: none; }
    .provider-section-title { font-size: 0.85rem; margin: 1rem 0 0.4rem; color: var(--accent-yellow); border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.35rem; }
    .photo-upload-area { border: 2px dashed var(--border-color); border-radius: var(--radius-md); padding: 1.25rem; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .photo-upload-area:hover { border-color: var(--accent-yellow); }
    .photo-add-btn { display: inline-flex; flex-direction: column; align-items: center; gap: 0.35rem; color: var(--text-secondary); font-size: 0.85rem; background: none; border: none; cursor: pointer; }
    .photo-add-btn span:first-child { font-size: 1.6rem; }
    .photo-preview-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
    .photo-thumb { position: relative; width: 76px; height: 76px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-color); flex-shrink: 0; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-thumb-remove { position: absolute; top: 3px; inset-inline-end: 3px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.65); color: #fff; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; line-height: 1; }
  </style>
</head>

<body class="rtl">
  <div id="site-header"></div>

  <main class="page-main auth-card-wrap">
    <div class="auth-card" id="register-card">
      <h2 class="section-title" data-i18n="register_title">إنشاء حساب جديد</h2>
      <p class="section-subtitle" id="register-subtitle" data-i18n="register_sub">انضم إلى أوتو كونيكت واستفد من خدماتنا المحفوظة</p>

      <div class="role-toggle" id="register-role-toggle">
        <button type="button" data-role="provider" data-i18n="service_provider">مزود خدمة</button>
        <button type="button" class="active" data-role="customer" data-i18n="customer">عميل</button>
      </div>

      <form id="register-form" novalidate>

        <!-- ─── Shared fields (all roles) ─── -->
        <div class="form-group">
          <label for="reg-email">
            <span data-i18n="email">البريد الإلكتروني</span> <span class="req">*</span>
          </label>
          <input class="form-control" type="email" id="reg-email" required>
          <span class="form-error" id="err-reg-email"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="fname">
              <span data-i18n="fname">الاسم الأول</span> <span class="req">*</span>
            </label>
            <input class="form-control" type="text" id="fname" required>
            <span class="form-error" id="err-fname"></span>
          </div>
          <div class="form-group">
            <label for="lname">
              <span data-i18n="lname">اسم العائلة</span> <span class="req">*</span>
            </label>
            <input class="form-control" type="text" id="lname" required>
            <span class="form-error" id="err-lname"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-password">
              <span data-i18n="password">كلمة المرور</span> <span class="req">*</span>
            </label>
            <input class="form-control" type="password" id="reg-password" required>
            <span class="form-error" id="err-reg-password"></span>
          </div>
          <div class="form-group">
            <label for="confirm-password">
              <span data-i18n="confirm_password">تأكيد كلمة المرور</span> <span class="req">*</span>
            </label>
            <input class="form-control" type="password" id="confirm-password" required>
            <span class="form-error" id="err-confirm-password"></span>
          </div>
        </div>

        <!-- ─── Customer-only fields ─── -->
        <div id="customer-fields">
          <div class="form-group">
            <label for="phone" data-i18n="phone">رقم الهاتف</label>
            <input class="form-control" type="tel" id="phone">
          </div>
        </div>

        <!-- ─── Provider-only fields ─── -->
        <div id="provider-fields" class="register-fields-hidden">

          <p class="provider-section-title" data-i18n="provider_form_title">بيانات مقدم الخدمة</p>

          <!-- Workshop name — bilingual -->
          <div class="form-row">
            <div class="form-group">
              <label for="name-ar">
                <span data-i18n="name_ar_label">اسم الورشة (بالعربية)</span> <span class="req">*</span>
              </label>
              <input class="form-control" type="text" id="name-ar" placeholder="مثال: أحمد لإصلاح السيارات">
              <span class="form-error" id="err-name-ar"></span>
            </div>
            <div class="form-group">
              <label for="name-en">
                <span data-i18n="name_en_label">Workshop name (English)</span> <span class="req">*</span>
              </label>
              <input class="form-control" type="text" id="name-en" dir="ltr" placeholder="e.g. Ahmed Auto Repair">
              <span class="form-error" id="err-name-en"></span>
            </div>
          </div>

          <!-- Mobile + Service category -->
          <div class="form-row">
            <div class="form-group">
              <label for="mobile">
                <span data-i18n="mobile">رقم الموبايل</span> <span class="req">*</span>
              </label>
              <input class="form-control" type="tel" id="mobile" placeholder="+20">
              <span class="form-error" id="err-mobile"></span>
            </div>
            <div class="form-group">
              <label for="provider-category">
                <span data-i18n="service_type">نوع الخدمة</span> <span class="req">*</span>
              </label>
              <select class="form-control" id="provider-category"></select>
              <span class="form-error" id="err-provider-category"></span>
            </div>
          </div>

          <!-- City (single select, language-aware) -->
          <div class="form-group">
            <label for="city-select">
              <span data-i18n="city_area">المدينة / المنطقة</span> <span class="req">*</span>
            </label>
            <select class="form-control" id="city-select"></select>
            <span class="form-error" id="err-city-select"></span>
          </div>

          <!-- Address — bilingual -->
          <div class="form-row">
            <div class="form-group">
              <label for="address-ar" data-i18n="address_ar_label">العنوان (بالعربية)</label>
              <input class="form-control" type="text" id="address-ar">
            </div>
            <div class="form-group">
              <label for="address-en">
                <span data-i18n="address_en_label">Address (English)</span> <span class="req">*</span>
              </label>
              <input class="form-control" type="text" id="address-en" dir="ltr">
              <span class="form-error" id="err-address-en"></span>
            </div>
          </div>

          <!-- Working hours — one row per day -->
          <div class="form-group">
            <label>
              <span data-i18n="working_hours">مواعيد العمل</span> <span class="req">*</span>
            </label>
            <div class="wh-grid">

              <div class="wh-row" data-day="Saturday">
                <span class="wh-day-name" data-i18n="day_sat">السبت</span>
                <label class="wh-closed-label">
                  <input type="checkbox" class="wh-closed">
                  <span data-i18n="day_off">إجازة</span>
                </label>
                <input type="time" class="form-control wh-time wh-open" value="09:00">
                <span>—</span>
                <input type="time" class="form-control wh-time wh-close" value="18:00">
              </div>

              <div class="wh-row" data-day="Sunday">
                <span class="wh-day-name" data-i18n="day_sun">الأحد</span>
                <label class="wh-closed-label">
                  <input type="checkbox" class="wh-closed">
                  <span data-i18n="day_off">إجازة</span>
                </label>
                <input type="time" class="form-control wh-time wh-open" value="09:00">
                <span>—</span>
                <input type="time" class="form-control wh-time wh-close" value="18:00">
              </div>

              <div class="wh-row" data-day="Monday">
                <span class="wh-day-name" data-i18n="day_mon">الاثنين</span>
                <label class="wh-closed-label">
                  <input type="checkbox" class="wh-closed">
                  <span data-i18n="day_off">إجازة</span>
                </label>
                <input type="time" class="form-control wh-time wh-open" value="09:00">
                <span>—</span>
                <input type="time" class="form-control wh-time wh-close" value="18:00">
              </div>

              <div class="wh-row" data-day="Tuesday">
                <span class="wh-day-name" data-i18n="day_tue">الثلاثاء</span>
                <label class="wh-closed-label">
                  <input type="checkbox" class="wh-closed">
                  <span data-i18n="day_off">إجازة</span>
                </label>
                <input type="time" class="form-control wh-time wh-open" value="09:00">
                <span>—</span>
                <input type="time" class="form-control wh-time wh-close" value="18:00">
              </div>

              <div class="wh-row" data-day="Wednesday">
                <span class="wh-day-name" data-i18n="day_wed">الأربعاء</span>
                <label class="wh-closed-label">
                  <input type="checkbox" class="wh-closed">
                  <span data-i18n="day_off">إجازة</span>
                </label>
                <input type="time" class="form-control wh-time wh-open" value="09:00">
                <span>—</span>
                <input type="time" class="form-control wh-time wh-close" value="18:00">
              </div>

              <div class="wh-row" data-day="Thursday">
                <span class="wh-day-name" data-i18n="day_thu">الخميس</span>
                <label class="wh-closed-label">
                  <input type="checkbox" class="wh-closed">
                  <span data-i18n="day_off">إجازة</span>
                </label>
                <input type="time" class="form-control wh-time wh-open" value="09:00">
                <span>—</span>
                <input type="time" class="form-control wh-time wh-close" value="18:00">
              </div>

              <div class="wh-row" data-day="Friday">
                <span class="wh-day-name" data-i18n="day_fri">الجمعة</span>
                <label class="wh-closed-label">
                  <input type="checkbox" class="wh-closed">
                  <span data-i18n="day_off">إجازة</span>
                </label>
                <input type="time" class="form-control wh-time wh-open" value="09:00">
                <span>—</span>
                <input type="time" class="form-control wh-time wh-close" value="18:00">
              </div>

            </div>
          </div>

          <!-- Bio / description — bilingual -->
          <div class="form-row">
            <div class="form-group">
              <label for="bio-ar" data-i18n="bio_ar_label">وصف الخدمة (بالعربية)</label>
              <textarea class="form-control" id="bio-ar" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label for="bio-en" data-i18n="bio_en_label">Description (English)</label>
              <textarea class="form-control" id="bio-en" rows="3" dir="ltr"></textarea>
            </div>
          </div>

          <!-- Photos (optional, max 10) -->
          <div class="form-group">
            <label>
              <span data-i18n="photos_label">صور الورشة</span>
              <span style="color:var(--text-muted);font-size:0.75rem" data-i18n="photos_hint"> — اختياري، حتى 10 صور</span>
            </label>
            <div class="photo-upload-area" id="photo-upload-area">
              <input type="file" id="photo-input" accept="image/*" multiple style="display:none">
              <button type="button" class="photo-add-btn" id="photo-add-btn">
                <span>📷</span>
                <span id="photo-add-label" data-i18n="add_photos">إضافة صور</span>
              </button>
            </div>
            <div class="photo-preview-grid" id="photo-preview-grid"></div>
            <span class="form-error" id="err-photos"></span>
          </div>

          <!-- Interactive map — Leaflet, initialized when provider tab is selected -->
          <div class="form-group">
            <label data-i18n="pin_on_map">حدد مكانك بدقة على الخريطة</label>
            <div id="register-map" style="height:220px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-color)"></div>
          </div>

        </div>
        <!-- /provider-fields -->

        <!-- General API error (email taken, server error, etc.) -->
        <span class="form-error" id="form-general-error" style="display:block;margin-bottom:0.5rem;text-align:center"></span>

        <button type="submit" class="btn btn-primary btn-block" id="register-submit" data-i18n="create_account">
          إنشاء حساب
        </button>
      </form>

      <p class="auth-footer-text" style="margin-top:1rem">
        <span data-i18n="have_account">لديك حساب بالفعل؟</span>
        <a href="login.html" data-i18n="signup_link">سجل الآن</a>
        ·
        <a href="services.html" data-i18n="continue_guest">المتابعة كزائر</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/pages.js"></script>
</body>

</html>
