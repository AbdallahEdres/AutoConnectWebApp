<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — Emergency</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="rtl">
  <div id="site-header"></div>

  <main class="page-main container">
    <section class="emergency-hero">
      <h1 data-i18n="emergency_title"></h1>
      <p data-i18n="emergency_sub"></p>
      <button type="button" class="btn btn-primary btn-block" id="btn-use-location" data-i18n="use_location" style="margin:1rem 0"></button>
      <p style="text-align:center;color:var(--text-secondary);font-size:0.9rem" data-i18n="or_choose_area"></p>
      <select class="form-control" id="region-select" style="margin-top:0.75rem"></select>
    </section>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem">
      <h2 class="section-title" data-i18n="nearest_providers"></h2>
      <span style="color:var(--text-secondary);font-size:0.9rem" data-i18n="results_by_location"></span>
    </div>
    <div id="emergency-results"></div>
  </main>

  <div class="emergency-banner">
    <div class="container">
      <strong>⚠</strong>
      <span data-i18n="emergency_footer"></span>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/mock-handlers.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/emergency.js"></script>
</body>
</html>
