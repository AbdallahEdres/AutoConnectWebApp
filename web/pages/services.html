<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — Services</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="rtl">
  <!-- ========================================== -->
  <!-- 1. HEADER INJECTION POINT                  -->
  <!-- Handled by: web/js/layout.js -> injectHeader() -->
  <!-- ========================================== -->
  <div id="site-header"></div>

  <main class="page-main container">
    <h1 class="section-title" data-i18n="filtered_services"></h1>
    <p class="section-subtitle" data-i18n="filtered_sub"></p>
    <div id="active-filters" style="margin-bottom:1rem;display:flex;gap:0.5rem;flex-wrap:wrap"></div>

    <!-- ========================================== -->
    <!-- 2. FILTER BAR START                        -->
    <!-- Handled by: web/js/services.js             -->
    <!-- (listens to #apply-filter click)           -->
    <!-- ========================================== -->
    <div class="filter-bar">
      <div class="form-group">
        <label data-i18n="search_services"></label>
        <input class="form-control" type="search" id="filter-search">
      </div>
      <div class="form-group">
        <label data-i18n="type"></label>
        <select class="form-control" id="filter-type"></select>
      </div>
      <div class="form-group">
        <label data-i18n="region"></label>
        <select class="form-control" id="filter-region"></select>
      </div>
      <div class="form-group">
        <label data-i18n="status"></label>
        <select class="form-control" id="filter-status">
          <option value=""></option>
          <option value="open" data-i18n="status_open"></option>
          <option value="closed" data-i18n="status_closed"></option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="sort_by"></label>
        <select class="form-control" id="filter-sort">
          <option value="nearest" data-i18n="sort_nearest"></option>
          <option value="rating" data-i18n="sort_rating"></option>
        </select>
      </div>
      <button type="button" class="btn btn-primary" id="apply-filter" data-i18n="apply_filter"></button>
    </div>
    <!-- ========================================== -->
    <!-- FILTER BAR END                             -->
    <!-- ========================================== -->

    <!-- ========================================== -->
    <!-- 3. RESULTS GRID START                      -->
    <!-- Handled by: web/js/services.js             -->
    <!-- (calls getProviders() and renders cards inside #providers-grid) -->
    <!-- ========================================== -->

    <div class="results-header">
      <p id="results-count"></p>
      <span class="badge-near" data-i18n="near_you"></span>
    </div>

    <div class="grid-3" id="providers-grid"></div>
    <!-- ========================================== -->
    <!-- RESULTS GRID END                           -->
    <!-- ========================================== -->

    <nav class="pagination" aria-label="Pagination">
      <button type="button" class="active">1</button>
      <button type="button">2</button>
      <button type="button">3</button>
    </nav>
  </main>

  <!-- ========================================== -->
  <!-- 4. FOOTER INJECTION POINT                  -->
  <!-- Handled by: web/js/layout.js -> injectFooter() -->
  <!-- ========================================== -->
  <div id="site-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/mock-handlers.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/services.js"></script>
</body>
</html>
