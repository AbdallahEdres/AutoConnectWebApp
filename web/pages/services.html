<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — الخدمات</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>

<body class="rtl">
  <div id="site-header"></div>

  <main class="page-main container">
    <h1 class="section-title" data-i18n="filtered_services">خدمات مصفاة</h1>
    <p class="section-subtitle" data-i18n="filtered_sub">عرض النتائج بناء على اختيارك</p>
    <div id="active-filters" style="margin-bottom:1rem;display:flex;gap:0.5rem;flex-wrap:wrap"></div>

    <div class="filter-bar">
      <div class="form-group">
        <label data-i18n="search_services">ابحث عن خدمة</label>
        <input class="form-control" type="search" id="filter-search">
      </div>
      <div class="form-group">
        <label data-i18n="type">النوع</label>
        <select class="form-control" id="filter-type"></select>
      </div>
      <div class="form-group">
        <label data-i18n="region">المنطقة</label>
        <select class="form-control" id="filter-region"></select>
      </div>
      <div class="form-group">
        <label data-i18n="status">الحالة</label>
        <select class="form-control" id="filter-status">
          <option value=""></option>
          <option value="open" data-i18n="status_open">مفتوح الآن</option>
          <option value="closed" data-i18n="status_closed">مغلق</option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="sort_by">ترتيب حسب</label>
        <select class="form-control" id="filter-sort">
          <option value="nearest" data-i18n="sort_nearest">الأقرب</option>
          <option value="rating" data-i18n="sort_rating">التقييم</option>
        </select>
      </div>
      <button type="button" class="btn btn-primary" id="apply-filter" data-i18n="apply_filter">تطبيق الفلتر</button>
    </div>

    <div class="results-header">
      <p id="results-count"></p>
      <span class="badge-near" data-i18n="near_you">بالقرب من موقعك</span>
    </div>

    <div class="grid-3" id="providers-grid"></div>

    <nav class="pagination" aria-label="Pagination">
      <button type="button" class="active">1</button>
      <button type="button">2</button>
      <button type="button">3</button>
    </nav>
  </main>

  <div id="site-footer"></div>

  <script src="../js/main.js"></script>
  <script src="../js/pages.js"></script>
  <script src="js/translat.js"></script>
</body>

</html>
