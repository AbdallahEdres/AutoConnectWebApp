<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — Provider Register</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>

<body class="rtl">
  <div id="site-header"></div>

  <main class="page-main container">
    <section class="provider-hero">
      <div class="hero-image" style="min-height:200px;background:url('../assets/images/مزود الخدمه.png') center/cover">
      </div>
      <div>
        <h1 class="section-title" data-i18n="provider_reg_title"></h1>
        <p class="section-subtitle" data-i18n="provider_reg_sub"></p>
      </div>
    </section>

    <article class="provider-form-card">
      <h2 data-i18n="provider_form_title"></h2>
      <form id="provider-form" style="margin-top:1.5rem">
        <div class="form-row">
          <div class="form-group">
            <label for="workshop-name" data-i18n="workshop_name"></label>
            <input class="form-control" type="text" id="workshop-name" required>
          </div>
          <div class="form-group">
            <label for="mobile" data-i18n="mobile"></label>
            <input class="form-control" type="tel" id="mobile" placeholder="+20" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="provider-category" data-i18n="service_type"></label>
            <select class="form-control" id="provider-category" required></select>
          </div>
          <div class="form-group">
            <label for="availability" data-i18n="availability"></label>
            <select class="form-control" id="availability">
              <option data-i18n="open_now"></option>
              <option data-i18n="status_closed"></option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="working-hours" data-i18n="working_hours"></label>
            <input class="form-control" type="text" id="working-hours" placeholder="9:00 - 18:00">
          </div>
          <div class="form-group">
            <label for="city-area" data-i18n="city_area"></label>
            <input class="form-control" type="text" id="city-area" required>
          </div>
        </div>
        <div class="form-group">
          <label for="service-desc" data-i18n="service_desc"></label>
          <textarea class="form-control" id="service-desc" rows="4"></textarea>
        </div>
        <div class="form-group">
          <label data-i18n="pin_on_map"></label>
          <div class="map-placeholder" style="height:200px" data-i18n="map_placeholder"></div>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem">
          <button type="submit" class="btn btn-primary" data-i18n="register_workshop"></button>
          <button type="button" class="btn btn-outline" data-i18n="save_later"></button>
        </div>
      </form>
    </article>

    <p style="text-align:center;color:var(--text-secondary);margin:1.5rem 0" data-i18n="quality_note"></p>
    <div class="trust-features">
      <div><span class="icon">🛡</span><span data-i18n="tech_support"></span></div>
      <div><span class="icon">📍</span><span data-i18n="geo_expand"></span></div>
      <div><span class="icon">⚡</span><span data-i18n="quick_response"></span></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/pages.js"></script>
</body>

</html>
