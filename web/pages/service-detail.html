<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — Service</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>

<body class="rtl">
  <div id="site-header"></div>

  <main class="page-main container">
    <div class="detail-hero" id="detail-hero"></div>
    <div class="detail-layout">
      <div class="detail-main">
        <article class="card">
          <h1 id="detail-title"></h1>
          <p id="detail-rating" style="color:var(--accent-yellow)"></p>
          <p id="detail-address" class="provider-card__meta"></p>
          <p id="detail-phone" style="font-size:1.25rem;margin:0.5rem 0"></p>
          <p id="detail-desc" style="color:var(--text-secondary)"></p>
          <div class="detail-actions">
            <a id="call-btn" href="#" class="btn btn-primary" data-i18n="call_now"></a>
            <button type="button" class="btn btn-ghost" data-i18n="our_location"></button>
            <button type="button" class="btn btn-outline" data-i18n="favorite">♥</button>
          </div>
        </article>
        <section class="card" style="margin-top:1.25rem" id="reviews-section">
          <h3 style="margin-bottom:0.75rem">التقييمات</h3>
          <ul id="reviews-list" style="color:var(--text-secondary);font-size:0.9rem"></ul>
        </section>
        <section style="margin-top:2rem">
          <div style="display:flex;justify-content:space-between;margin-bottom:1rem">
            <h2 class="section-title" data-i18n="similar_nearby"></h2>
            <a href="services.html" data-i18n="view_all"></a>
          </div>
          <div class="grid-3" id="similar-grid"></div>
        </section>
      </div>
      <aside>
        <article class="card" style="margin-bottom:1rem">
          <h3 data-i18n="live_status"></h3>
          <p><span class="status-dot open"></span> <span id="live-status"></span></p>
          <p class="provider-card__meta"><span data-i18n="waiting_time"></span>: <span id="wait-time"></span></p>
          <p class="provider-card__meta"><span data-i18n="capacity"></span>: <span id="capacity"></span></p>
        </article>
        <article class="card">
          <div class="map-placeholder" data-i18n="our_location">Map</div>
        </article>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/main.js"></script>
  <script src="../js/pages.js"></script>
  <script src="js/translat.js"></script>
</body>

</html>
