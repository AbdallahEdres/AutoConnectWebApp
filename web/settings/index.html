<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoConnect — الإعدادات</title>
  <link rel="stylesheet" href="../variables.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="settings.css">
</head>

<body class="rtl">
  <div id="site-header"></div>

  <div class="layout-with-sidebar container page-main" style="padding-top:1.5rem">
    <aside class="sidebar" id="sidebar-nav"></aside>

    <div>
      <h1 class="section-title" data-i18n="settings_title"></h1>
      <p class="section-subtitle" data-i18n="settings_sub"></p>

      <div class="settings-grid">
        <article class="card">
          <h3 data-i18n="change_password"></h3>
          <form id="password-form" novalidate style="margin-top:1rem">
            <div class="form-group">
              <label for="current-password" data-i18n="current_password"></label>
              <input class="form-control" type="password" id="current-password" placeholder="********">
              <span class="form-error" id="err-current"></span>
            </div>
            <div class="form-group">
              <label for="new-password" data-i18n="new_password"></label>
              <input class="form-control" type="password" id="new-password" placeholder="********">
              <span class="form-error" id="err-new"></span>
            </div>
            <div class="form-group">
              <label for="confirm-password" data-i18n="confirm_new_password"></label>
              <input class="form-control" type="password" id="confirm-password" placeholder="********">
              <span class="form-error" id="err-confirm"></span>
            </div>
            <p id="password-msg" style="font-size:0.9rem;margin-bottom:0.75rem"></p>
            <button type="submit" class="btn btn-primary" data-i18n="update_password"></button>
          </form>
        </article>

        <article class="card">
          <h3 data-i18n="security_tips"></h3>
          <ul class="tips-list" style="margin-top:1rem">
            <li data-i18n="tip1"></li>
            <li data-i18n="tip2"></li>
            <li data-i18n="tip3"></li>
          </ul>
          <div class="map-placeholder" style="margin-top:1.5rem;height:120px">🔒</div>
        </article>

        <article class="card delete-account-card">
          <h3 style="color:var(--accent-red)">⚠ <span data-i18n="delete_account"></span></h3>
          <p style="color:var(--text-secondary);margin:0.75rem 0;font-size:0.9rem" data-i18n="delete_account_desc"></p>
          <button type="button" class="btn btn-outline" id="delete-account-btn" disabled
            style="opacity:0.5;cursor:not-allowed" data-i18n="delete_my_account"></button>
        </article>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="../i18n.js"></script>
  <script src="../main.js"></script>
  <script src="settings.js"></script>
</body>

</html>
